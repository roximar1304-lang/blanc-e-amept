<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blanc & Âme</title>
  <meta name="theme-color" content="#F2E6DC" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#F2E6DC;margin:0;display:grid;place-items:center;min-height:100vh}
    .card{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
    h1{margin:0 0 10px;font-size:20px;color:#3a2f2c}
    p{margin:0 0 16px;color:#6b5a55;line-height:1.35}
    a.btn{display:block;text-decoration:none;background:#BFA6A0;color:#fff;padding:14px 16px;border-radius:14px;font-weight:700}
    a.link{display:inline-block;margin-top:12px;color:#3a2f2c}
  </style>
</head>
<body>
  <div class="card">
    <h1>@BLANC.E.AMEPT</h1>
    <p>Si tienes Instagram instalado, se abrirá la app. Si no, abrirá el perfil en navegador.</p>
    <a class="btn" id="openBtn" href="#">Abrir en Instagram</a>
    <a class="link" id="webLink" href="https://www.instagram.com/BLANC.E.AMEPT/" rel="noopener">Abrir en navegador</a>
  </div>

  <script>
    const username = "BLANC.E.AMEPT";
    const webUrl = "https://www.instagram.com/" + username + "/";
    // Android intent (fuerza apertura en app si existe)
    const androidIntent = "intent://www.instagram.com/_u/" + username + "/#Intent;package=com.instagram.android;scheme=https;end";
    // iOS scheme
    const iosScheme = "instagram://user?username=" + username;

    function openApp() {
      const ua = navigator.userAgent || "";
      const isAndroid = /Android/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);

      // Intento de abrir app
      if (isAndroid) window.location.href = androidIntent;
      else if (isIOS) window.location.href = iosScheme;

      // Fallback a web si no abre app
      setTimeout(() => { window.location.href = webUrl; }, 1200);
    }

    document.getElementById("openBtn").addEventListener("click", (e) => {
      e.preventDefault();
      openApp();
    });

    // Auto-intento al cargar (mejor para QR)
    openApp();

    document.getElementById("webLink").href = webUrl;
  </script>
</body>
</html>
