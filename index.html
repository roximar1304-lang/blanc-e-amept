<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blanc & Âme</title>
  <meta name="theme-color" content="#F2E6DC" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#F2E6DC;margin:0;display:grid;place-items:center;min-height:100vh}
    .card{background:#fff;border-radius:20px;padding:24px;max-width:440px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
    .brand{font-weight:800;letter-spacing:.3px;color:#3a2f2c;font-size:22px;margin:0}
    .sub{color:#6b5a55;line-height:1.35;margin:10px 0 18px}
    .handle{font-weight:700;color:#BFA6A0;margin:0 0 18px}
    .btn{display:block;text-decoration:none;background:#BFA6A0;color:#fff;padding:14px 16px;border-radius:14px;font-weight:800}
    .btn2{display:block;text-decoration:none;background:#3a2f2c;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;margin-top:10px}
    .tiny{font-size:12px;color:#8a7a75;margin-top:14px}
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">Blanc & Âme</p>
    <p class="handle">@BLANC.E.AMEPT</p>
    <p class="sub">Toca el botón para abrir el perfil en la app. Si no tienes la app, abrirá en navegador.</p>

    <!-- Botón principal -->
    <a class="btn" href="https://www.instagram.com/BLANC.E.AMEPT/" target="_blank" rel="noopener">
      Abrir Instagram
    </a>

    <!-- Botón extra (por si el móvil es terco) -->
    <a class="btn2" href="https://m.instagram.com/BLANC.E.AMEPT/" target="_blank" rel="noopener">
      Abrir en navegador
    </a>

    <p class="tiny">Si al abrir se queda en el home, vuelve atrás y toca “Abrir Instagram” otra vez.</p>
  </div>
</body>
</html>
